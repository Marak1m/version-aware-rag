[project]
name = "varag"
version = "0.1.0"
description = "Version-aware RAG: benchmark, pipeline and two-environment execution harness"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.scripts]
varag = "varag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "envs: needs the built library environments (envs/manifest.json)",
]
