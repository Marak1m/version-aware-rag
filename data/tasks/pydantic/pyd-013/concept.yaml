id: pyd-013
library: pydantic
split: test
query: >
  Write `product_schema()` returning the JSON schema, as a dict, of a pydantic model `Product`
  with fields `name: str` and `price: float`. The schema must carry a top-level `examples` entry
  equal to `[{"name": "pen", "price": 1.5}]`, added through the model's configuration (not on a
  field and not by editing the returned dict). Generate the schema with the model's own schema
  method.
entry_point: product_schema
exclusivity: removal
change_type: param_rename
warnings_as_errors: false
portable_alternative: guard_only
gold:
  old: ["pydantic.Config.schema_extra"]
  new: ["pydantic.Config.json_schema_extra"]

clues:
  old:
    - {type: pin, file: clues/old_pin.txt, overlap: off_target}
    - {type: code, file: clues/old_code.txt, overlap: off_target}
    - {type: error, file: clues/old_error.txt, overlap: off_target}
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
    - {type: error, file: clues/new_error.txt, overlap: off_target}
control_eligible: true
