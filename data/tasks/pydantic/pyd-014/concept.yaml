id: pyd-014
library: pydantic
split: test
query: >
  Write `make_settings(data)` returning an instance of a pydantic model built from the dict
  `data`, with one field `workers: int` whose default is the string `"4"` (as read from a config
  file). Configure the model so that default values are validated too, so that when `workers` is
  missing it comes back as the integer 4. Use the model's configuration, not a validator.
entry_point: make_settings
exclusivity: removal
change_type: param_rename
warnings_as_errors: false
portable_alternative: plain
gold:
  old: ["pydantic.Config.validate_all"]
  new: ["pydantic.Config.validate_default"]

clues:
  old:
    - {type: pin, file: clues/old_pin.txt, overlap: off_target}
    - {type: code, file: clues/old_code.txt, overlap: off_target}
    - {type: error, file: clues/old_error.txt, overlap: off_target}
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
    - {type: error, file: clues/new_error.txt, overlap: off_target}
control_eligible: false
