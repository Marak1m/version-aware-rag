id: pyd-007
library: pydantic
split: dev
query: >
  Write `make_cart(items)` returning an instance of a pydantic model whose field
  `items: list[str]` must contain at least two entries. Enforce the minimum through a
  `Field` constraint on the field itself, not a custom validator; too few items must raise
  pydantic's ValidationError.
entry_point: make_cart
exclusivity: deprecation
change_type: param_rename
warnings_as_errors: true
portable_alternative: none
gold:
  old: ["pydantic.Field(min_items)"]
  new: ["pydantic.Field(min_length)"]

clues:
  old:
    - {type: pin, file: clues/old_pin.txt, overlap: off_target}
    - {type: code, file: clues/old_code.txt, overlap: off_target}
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
control_eligible: true
