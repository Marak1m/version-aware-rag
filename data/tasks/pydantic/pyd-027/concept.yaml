id: pyd-027
library: pydantic
split: test
query: >
  Write `coerce_user(value)` that accepts either an existing instance of a pydantic model
  `User` (fields `id: int` and `name: str`) or a dict, and returns a validated `User`, using the
  model's own validation classmethod that takes either form. Invalid data must raise pydantic's
  ValidationError.
