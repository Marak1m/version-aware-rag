id: np-013
library: numpy
split: test
query: >
  Write `common_dtype(dtypes)` that takes a non-empty list of NumPy dtypes (dtype objects or
  names such as `"int8"`) and returns, as a `np.dtype`, the smallest dtype that all of them
  can be safely cast to. Use NumPy's own type-promotion helpers, not a hand-written table.
entry_point: common_dtype
exclusivity: one_directional
change_type: symbol_removed
warnings_as_errors: false
portable_alternative: plain
gold:
  old: ["numpy.find_common_type"]
  new: ["numpy.promote_types"]
clues:
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
    - {type: error, file: clues/new_error.txt, overlap: off_target}
control_eligible: false
