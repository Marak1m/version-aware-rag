id: pd-011
library: pandas
split: test
query: >
  Write `zone_of(index)` that takes a DatetimeIndex that was localized with `tz_localize` to an
  IANA time zone given by name, and returns that zone's IANA name as a string (for example
  "Europe/Paris", not an abbreviation such as "CET"), taken from the time-zone object pandas
  attached to the index (`index.tz`).
entry_point: zone_of
exclusivity: behavior
