id: pd-009
library: pandas
split: test
query: >
  Write `tally(s)` that takes a named pandas Series `s` and returns a DataFrame of its value
  counts, most frequent first, with exactly two columns: `value` (the distinct values) and `n`
  (how often each occurs), and a fresh 0-based index. Build it from `s.value_counts()`, turn the
  result into a frame with `reset_index()`, then rename the columns it produces.
