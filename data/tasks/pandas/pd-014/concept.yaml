id: pd-014
library: pandas
split: test
query: >
  Write `add_row(df, row)` that returns a new DataFrame consisting of `df` followed by one more
  row built from the dict `row` (its keys are column names), with the index renumbered 0, 1, 2,
  ... Do not modify `df` itself.
entry_point: add_row
exclusivity: one_directional
change_type: symbol_removed
warnings_as_errors: false
portable_alternative: plain
gold:
  old: ["pandas.DataFrame.append"]
  new: ["pandas.concat"]
clues:
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
    - {type: error, file: clues/new_error.txt, overlap: off_target}
control_eligible: false
