id: pd-008
library: pandas
split: test
query: >
  Write `fiscal_year_ends(start, n)` returning a pandas DatetimeIndex of the `n` year-end dates
  of a fiscal year that closes on 30 June, beginning with the first 30 June on or after `start`
  (a date string). Build it with `date_range` and an annual year-end frequency alias anchored on
  June, not by arithmetic on dates.
