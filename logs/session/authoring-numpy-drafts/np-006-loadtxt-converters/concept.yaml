id: np-006
library: numpy
split: test
query: >
  Write `read_decimal_commas(text)` that parses `text`, lines of semicolon-separated numbers
  written with a decimal comma (for example `1,5;2,25`), into a 2-D float NumPy array. Use
  `np.loadtxt` with a converter function that turns each field into a float.
