id: np-013
library: numpy
split: test
query: >
  Write `add_offset(pixels)` that takes a NumPy uint8 array and returns a NumPy array holding
  each value plus 300 exactly, with no wrap-around, in the smallest unsigned integer dtype
  that fits the results. Add the Python integer 300 to the array with NumPy arithmetic.
entry_point: add_offset
exclusivity: one_directional
change_type: behavior
warnings_as_errors: false
portable_alternative: plain
gold:
  old: ["numpy.array"]
  new: ["numpy.ndarray.astype"]
clues:
  new:
    - {type: pin, file: clues/new_pin.txt, overlap: off_target}
    - {type: code, file: clues/new_code.txt, overlap: off_target}
control_eligible: false
