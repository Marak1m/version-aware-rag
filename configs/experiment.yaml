# Methods, thresholds, corpus flags, user arm and seeds. Thresholds are tuned on the
# dev split only and frozen before any test-split run.
seed: 1234

split:
  dev_fraction: 0.25       # dev is the 15 seed concepts (3 NumPy, 5 pandas, 7 pydantic); test keeps the rest

# Deprecation concepts (the old API still runs on the new side, with a warning) are scored two
# ways. strict: deprecated usage fails (warnings attributed to the solution are errors); this is
# the primary score. lenient: it passes and is flagged soft_fail. Both are reported; the choice
# was recorded before any test-split run (docs/DECISIONS.md, 2026-10-18).
scoring:
  deprecation:
    primary: strict
    report: [strict, lenient]

# Frozen 2026-10-19 on the 28 dev clue instances (`varag bench thresholds`): every tau_commit up to
# 3.0 commits all 28 with no wrong commit; 3.5 leaves 2 uncommitted. Re-frozen the same day after
# the tau_noise check on the 13 dev contradiction instances (one side's pin, the other side's
# code): every tau_noise below 3.0 detects all 13 as CONTEXT_CONFLICT; the weakest code side is
# pd-002's, S = 3.0. Do not change either value; `varag run` refuses the test split while
# frozen_on is missing.
thresholds:
  tau_commit: 3.0
  tau_noise: 1.5
  frozen_on: "2026-10-19"
  frozen_split: dev
  checked: [dev clue instances (28), dev contradiction instances (13)]

corpus:
  k_distract: 2
  example_timeout_s: 10
  show_version_tags: true
  include_migration: false
  strip_deprecation_notes: false

user_arm: knows            # knows | unsure

# Benchmark composition caps on concept classes (exclusivity), controls excluded. `share` is a
# fraction of the concepts in scope: the whole benchmark, or each library (minus `exempt`).
composition:
  caps:
    one_directional: {share: "1/3", scope: benchmark}                     # user decision 2026-10-15
    behavior: {share: "15/100", scope: library, exempt: [pandas, numpy]}  # handoff; pandas/NumPy exempt (2026-10-15)

execution:
  timeout_s: 60
  memory_mb: 2048
  repeats: 3               # validation matrix repeats
  workers: 8               # `varag run` executes answers in this many threads while generation stays sequential

methods:
  - no_retrieval
  - plain_rag
  - mind_version
  - assume_state
  - two_branch
  - always_ask
  - oracle_docs
  - va_rag
  - va_rag_no_infer
  - va_rag_no_ask
  - va_rag_no_guard
  - va_rag_portable_first  # L16 (user decision 2026-10-21)

# Frozen prompts (`varag bench freeze-prompts`): sha256 over every prompt text the methods send
# (varag.pipeline.prompts). Test runs refuse to start when the live hash differs.
prompts:
  sha256: "50a3a8f24c016f7f9c90abf786432b2dc315398c1c6038c2e89ef20dca7c8570"
  frozen_on: "2026-10-21"
  note: "User decision 2026-10-21: accept small's 6.5% no_entry_point on dev (all pydantic class-without-function answers); mid and large met the dev acceptance (0% no_entry_point, 0% second questions). Frozen on the dev sweep of 2026-10-20."
