# Model backends, all behind one OpenAI-compatible chat client, and the pinned sampling block.
# Every sampling parameter is sent explicitly in every request (handoff L1). The client speaks
# the OpenAI chat-completions protocol only, so a llama.cpp server (llama-server) can stand in
# for vLLM at the same base_url when vLLM fails on the GPU (user decision 2026-10-18).
#
# Real models are pinned by Hugging Face revision (commit sha, read from the HF API on 2026-10-18)
# and their quantization is copied from the repo's config.json; `varag run` records the whole
# backend block in run.json. Nothing is downloaded on the build laptop: serving is the PC's job
# (docs/GPU_HANDOFF.md).
backends:
  # --- OpenRouter: all model inference from 2026-10-19 (docs/DECISIONS.md, "Inference moves to OpenRouter").
  # One pinned provider per model; every request sends the sampling block below and
  # provider: {order: [provider], allow_fallbacks: false, require_parameters: true}.
  # The key comes from OPENROUTER_API_KEY or the git-ignored ./openrouter-api-key; never from here.
  # repeats (user decision 2026-10-21): every (instance, method) is answered this many times in one
  # session, the repeat index in the cache key; an instance's score is the mean over its repeats.
  # Small and large are noisy at temperature 0 (dev noise check 2026-10-20: 33% and 57% of
  # responses change within a session); mid runs once (3%).
  small:                                        # qwen/qwen2.5-coder-7b-instruct has no live endpoint (2026-10-19)
    type: openrouter
    model: "qwen/qwen-2.5-7b-instruct"
    provider: "phala"
    provider_name: "Phala"
    context_length: 32768
    repeats: 3
    provider_note: "qwen/qwen2.5-coder-7b-instruct had no live endpoint on 2026-10-19, so the general 7B instruct model stands in"
    seconds_per_answer: 1.5                     # gpu-sweep estimate until a run is measured
  mid:
    type: openrouter
    model: "qwen/qwen-2.5-coder-32b-instruct"
    provider: "cloudflare"
    provider_name: "Cloudflare"
    context_length: 32768
    repeats: 1
    seconds_per_answer: 2.0
  large:                                        # DeepInfra honours repetition_penalty; Google Vertex accepts and ignores it
    type: openrouter
    model: "qwen/qwen3-coder"
    provider: "deepinfra/turbo"
    provider_name: "DeepInfra"
    quantization_reported: fp4
    context_length: 262144
    repeats: 3
    provider_note: "served as fp4 by DeepInfra; Google Vertex was rejected because it accepts repetition_penalty and ignores it (probe of 2026-10-19: 1.0 and 2.0 gave the same text)"
    seconds_per_answer: 2.5

  mock_ref:   {type: mock, behaviour: ref}      # returns the target-version reference: 100% anchor
  mock_wrong: {type: mock, behaviour: wrong}    # returns the other version's reference: 0% anchor
  mock_blend: {type: mock, behaviour: blend}    # one symbol from each side: guard tests (M6)
  mock_ask:   {type: mock, behaviour: ask}      # always asks, then returns the reference (M6)

  primary:                                      # the 7B model every v0 number is reported on
    active: false                               # local serving retired 2026-10-19; code kept
    type: openai_chat
    model: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
    revision: "8e8ed243bbe6f9a5aff549a0924562fc719b2b8a"
    quantization: {method: awq, bits: 4, group_size: 128, version: gemm, zero_point: true, dtype: float16}
    max_model_len: 8192
    base_url: "http://localhost:8000/v1"
    served_model_name: "primary"
    server: vllm
    serve_args: ["--generation-config", "vllm", "--max-model-len", "8192", "--quantization", "awq",   # never inherit the repo's generation_config.json
                 "--gpu-memory-utilization", "0.5", "--max-num-seqs", "4"]   # Windows apps hold ~6.6 GiB of the 16 GiB (docs/GPU_HANDOFF.md)
    disk_gb: 6                                  # approximate weights size, for the preflight free-space check
    seconds_per_answer: 0.4                     # measured 2026-10-19: 342 s for 913 uncached answers, 8 execution workers; gpu-day's fallback estimate

  primary_genconfig:                            # L1 test only: the same 7B under the repository's own generation config
    active: false                               # local serving retired 2026-10-19; code kept
    type: openai_chat
    model: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
    revision: "8e8ed243bbe6f9a5aff549a0924562fc719b2b8a"
    quantization: {method: awq, bits: 4, group_size: 128, version: gemm, zero_point: true, dtype: float16}
    max_model_len: 8192
    base_url: "http://localhost:8000/v1"
    served_model_name: "primary_genconfig"
    server: vllm
    serve_args: ["--generation-config", "auto", "--max-model-len", "8192", "--quantization", "awq",
                 "--gpu-memory-utilization", "0.5", "--max-num-seqs", "4"]
    sampling_profile: model_default             # requests send only max_tokens and seed; the server's defaults apply
    disk_gb: 0                                  # same weights as primary
    report: false

  vllm_large:                                   # the scale comparison: same AWQ 4-bit, twice the parameters
    active: false                               # local serving retired 2026-10-19; code kept
    type: openai_chat
    model: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
    revision: "eb3172f06a6d6b3a15f08947b0668d782e4d2d2c"
    quantization: {method: awq, bits: 4, group_size: 128, version: gemm, zero_point: true, dtype: float16}
    max_model_len: 8192
    base_url: "http://localhost:8001/v1"
    served_model_name: "vllm_large"
    server: vllm
    serve_args: ["--generation-config", "vllm", "--max-model-len", "8192", "--quantization", "awq",
                 "--gpu-memory-utilization", "0.86", "--max-num-seqs", "4"]   # needs other processes to hold <= 2.2 GiB: close GPU-heavy Windows apps (docs/GPU_HANDOFF.md)
    disk_gb: 10
    seconds_per_answer: 1.0                     # measured 2026-10-19: 932 s for 913 uncached answers

  cpu_tiny:                                     # parsing checks on real output, CPU only; results are never reported
    active: false                               # local serving retired 2026-10-19; code kept
    type: openai_chat
    model: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
    revision: "ea3f2471cf1b1f0db85067f1ef93848e38e88c25"
    quantization: {method: none, dtype: bfloat16}
    max_model_len: 8192
    base_url: "http://localhost:8080/v1"
    served_model_name: "cpu_tiny"
    server: llama_cpp                            # llama-server (ggml-org/llama.cpp build b11723), scripts/serve_cpu_tiny.sh
    gguf: {repo: "Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF", revision: "ebb2015119c907b064c512bf053e945850b5875f", file: "qwen2.5-coder-0.5b-instruct-q8_0.gguf"}
    report: false

# The serving stack on the GPU PC (docs/GPU_HANDOFF.md). vLLM lives in its own venv, outside the
# repository and outside the orchestrator's environment: it needs Python 3.12 wheels built for
# CUDA 12.8 or later, which is what Blackwell (sm_120) requires. `varag preflight` checks it.
serving:
  vllm:
    version: "0.31.0"                           # 0.32.0 was a day old on 2026-10-19; 0.31.0 was released 2026-10-05
    python: "~/.venvs/vllm-0.31.0/bin/python"
    install: "uv venv --python 3.12 ~/.venvs/vllm-0.31.0 && VIRTUAL_ENV=~/.venvs/vllm-0.31.0 uv pip install vllm==0.31.0 --torch-backend=auto"
    min_cuda: "12.8"
  min_free_disk_gb: 20                          # at HF_HOME, for both models' weights and the caches

sampling:
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0
  max_tokens: 1024
  seed: 1234
  n: 1

cache_dir: "runs/_cache"

# Tokenizer used to count chunk tokens (350-token cap). Pinned by model revision; the file is
# downloaded on demand to data/tokenizer/ (gitignored) and checked against sha256. The AWQ repos
# ship the same Qwen2.5-Coder tokenizer; the pin stays on the fp16 repo it was taken from.
tokenizer:
  repo: "Qwen/Qwen2.5-Coder-7B-Instruct"
  revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  file: "tokenizer.json"
  sha256: "c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539"
  local_path: "data/tokenizer/qwen2.5-coder-7b-instruct.tokenizer.json"
