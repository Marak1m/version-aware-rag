# Library-authored migration messages that only one version can emit (handoff L15). They are
# decisive signals for the version the user runs. A pattern is admitted only after it was
# reproduced in exactly one environment; `reproduced` records that run. M5 reads this file and
# extends it (NumPy "was removed in the NumPy 2.0 release", PydanticImportError, pandas
# "frame.append method is deprecated", ...) after reproducing each one.
#
# The execution harness also reads it: a warning attributed to solution.py whose message
# contains `pattern` (a literal substring) or matches `regex` counts toward soft_fail, whatever
# its category. That is how non-deprecation categories (pydantic's config-key UserWarning) count.
pydantic:
  - pattern: "Valid config keys have changed in V2"
    side: new
    kind: config-keys-renamed
    category: UserWarning
    source: "pydantic._internal._config (ConfigWrapper), on a V1 config key in model_config or class Config"
    reproduced: "pydantic_new 2.13.4 on 2026-10-08, model_config = {'anystr_strip_whitespace': True}; absent in pydantic_old 1.10.13 for the same model and for class Config"
  - pattern: "`regex` is removed. use `pattern` instead"
    side: new
    kind: removed-kwargs
    source: "pydantic.fields.Field, PydanticUserError code=removed-kwargs"
    reproduced: "pydantic_new 2.13.4 on 2026-10-08, Field(regex='x'); absent in pydantic_old 1.10.13 where Field(regex=...) is accepted"
  - pattern: "`const` is removed, use `Literal` instead"
    side: new
    kind: removed-kwargs
    source: "pydantic.fields.Field, PydanticUserError code=removed-kwargs"
    reproduced: "pydantic_new 2.13.4 on 2026-10-08, Field(const=1)"
  - pattern: "`unique_items` is removed, use `Set` instead"
    side: new
    kind: removed-kwargs
    source: "pydantic.fields.Field, PydanticUserError code=removed-kwargs"
    reproduced: "pydantic_new 2.13.4 on 2026-10-08, Field(unique_items=1)"
  - regex: "errors\\.pydantic\\.dev/2\\."
    side: new
    kind: v2-error-url
    source: "every PydanticUserError and PydanticImportError in V2 ends with a documentation URL under errors.pydantic.dev/2.x/"
    reproduced: "pydantic_new 2.13.4 on 2026-10-19, @root_validator without skip_on_failure (make-error-clue pyd-004 new); pydantic_old 1.10.13 has neither exception class nor the URLs"
  - pattern: "PydanticDeprecatedSince20"
    side: new
    kind: v2-deprecation-class
    source: "pydantic.warnings (V2 only), emitted for every V1-style API still served"
    reproduced: "pydantic_new 2.13.4 on 2026-10-19, @root_validator (make-error-clue pyd-004 new); the class does not exist in pydantic_old 1.10.13"
  - regex: "Pydantic(?:User|Import)Error"
    side: new
    kind: v2-error-class
    source: "pydantic.errors (V2 only)"
    reproduced: "pydantic_new 2.13.4 on 2026-10-19, `from pydantic import BaseSettings` raises PydanticImportError (make-error-clue pyd-003 new); the classes do not exist in pydantic_old 1.10.13"
  - pattern: "has been moved to the `pydantic-settings` package"
    side: new
    kind: settings-moved
    source: "pydantic._migration, PydanticImportError for BaseSettings"
    reproduced: "pydantic_new 2.13.4 on 2026-10-19, `from pydantic import BaseSettings`; pydantic_old 1.10.13 imports it"
# NumPy 2.4.6 raises plain AttributeErrors for expired names ("module 'numpy' has no attribute
# 'trapz'"), without the 2.0-era "was removed in the NumPy 2.0 release" text, so there is no
# library-authored message to admit; the error-names-symbol signal covers it (reproduced
# numpy_new 2.4.6 on 2026-10-18 for np.trapz and np.in1d).
numpy: []
pandas:
  - pattern: "The frame.append method is deprecated"
    side: old
    kind: append-deprecated
    category: FutureWarning
    source: "pandas.core.frame.DataFrame.append, 1.x"
    reproduced: "pandas_old 1.5.3 on 2026-10-18, df.append(df); pandas_new 3.0.6 raises AttributeError instead"
  - regex: "Invalid frequency: .*Failed to parse with error message"
    side: new
    kind: frequency-parse-detail
    source: "pandas.tseries.frequencies.to_offset, 2.2+ wraps the parser error"
    reproduced: "pandas_new 3.0.6 on 2026-10-18, date_range(freq='M') and to_period('ME'); pandas_old 1.5.3 says only 'Invalid frequency: ME'"
  - pattern: "for Period, please use"
    side: new
    kind: period-alias-hint
    source: "pandas._libs.tslibs.offsets, 2.2+"
    reproduced: "pandas_new 3.0.6 on 2026-10-18, Series.to_period('ME'); absent in pandas_old 1.5.3"
